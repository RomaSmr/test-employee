services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: employess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employess"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./EmployeeApi
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=employess;Username=postgres;Password=123"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - photos:/app/wwwroot/photos

  front:
    build: ./employee-front
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  photos: