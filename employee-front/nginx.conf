server {
    listen 80;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
    }

    location /photos/ {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}